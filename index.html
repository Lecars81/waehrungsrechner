<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Währungsrechner</title>
<meta name="theme-color" content="#EFF0F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#282830" media="(prefers-color-scheme: dark)">
<link rel="preload" href="fonts/ToyotaType-Light.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ToyotaType-Semibold.woff2" as="font" type="font/woff2" crossorigin>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Währung">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  @font-face{font-family:"Toyota Type";src:url(fonts/ToyotaType-Light.woff2) format("woff2");font-weight:300;font-display:swap}
  @font-face{font-family:"Toyota Type";src:url(fonts/ToyotaType-Book.woff2) format("woff2");font-weight:350;font-display:swap}
  @font-face{font-family:"Toyota Type";src:url(fonts/ToyotaType-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Toyota Type";src:url(fonts/ToyotaType-Semibold.woff2) format("woff2");font-weight:600;font-display:swap}
  /* Toyota VI 2026: Signature Grey #282830, Signature Red #FF0022 (nur Akzent), White, Greys 1–6 */
  :root{
    --sig-grey:#282830; --red:#FF0022; --white:#fff;
    --g1:#494950; --g2:#6A6B70; --g3:#8B8C90; --g4:#ADADB0; --g5:#CECFD0; --g6:#EFF0F0;
    --ink:var(--sig-grey); --muted:var(--g2); --line:var(--g5); --bg:var(--g6);
    --card:rgba(255,255,255,.8); --field:var(--g6); --btn-bg:var(--sig-grey); --btn-ink:#fff;
    --car-opacity:.42;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#fff; --muted:var(--g4); --line:var(--g1); --bg:var(--sig-grey);
      --card:rgba(73,73,80,.62); --field:rgba(40,40,48,.6); --btn-bg:#fff; --btn-ink:var(--sig-grey); --car-opacity:.3; }
    .logo-box .logo-grey{display:none} .logo-box .logo-white{display:block}
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Toyota Type",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-weight:350;-webkit-text-size-adjust:100%}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100vh}
  /* GR Yaris dezent im Hintergrund */
  .bg-car{position:absolute;top:calc(env(safe-area-inset-top) + 44px);right:max(-32vw,calc(50% - 520px));width:min(118vw,640px);
    opacity:var(--car-opacity);pointer-events:none;z-index:0;user-select:none;-webkit-user-drag:none;
    -webkit-mask-image:linear-gradient(to right,transparent 0%,#000 55%);mask-image:linear-gradient(to right,transparent 0%,#000 55%)}
  body{position:relative}
  .wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:22px 22px 28px}
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:26px}
  .logo{width:40px;height:auto;display:block}
  .logo-box .logo-white{display:none}
  .headline{margin:0 0 18px}
  .headline .bar{display:block;width:44px;height:4px;background:var(--red);margin-bottom:12px}
  h1{font-size:30px;margin:0;font-weight:300;letter-spacing:.01em;line-height:1;text-transform:uppercase}
  .headline p{margin:8px 0 0;font-size:14px;color:var(--muted);font-weight:400}
  .status{font-size:12px;display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:400;
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 10px;margin-top:4px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ink)}
  .status.off .dot{background:var(--red)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin-bottom:12px;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .row{display:flex;gap:10px;align-items:center}
  .amount{flex:1;min-width:0;font-family:inherit;font-size:32px;font-weight:300;border:none;background:transparent;color:var(--ink);
    outline:none;padding:4px 0;font-variant-numeric:tabular-nums}
  .cur-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--field);color:var(--ink);
    border-radius:4px;padding:10px 12px;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;white-space:nowrap}
  .cur-btn .flag{font-size:20px;line-height:1}
  .cur-btn .chev{color:var(--muted);font-size:11px}
  .label{font-size:11px;color:var(--muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:.08em;font-weight:400}
  .result{flex:1;min-width:0;font-size:32px;font-weight:400;padding:4px 0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-variant-numeric:tabular-nums}
  .swap-wrap{display:flex;justify-content:center;margin:-20px 0 -8px;position:relative;z-index:2}
  .swap{width:44px;height:44px;border-radius:50%;border:3px solid var(--bg);background:var(--btn-bg);color:var(--btn-ink);
    font-size:19px;cursor:pointer;display:grid;place-items:center}
  .rate{font-size:13px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums;font-weight:400}
  .sec-head{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 8px}
  .sec-head h2{font-size:12px;margin:0;font-weight:400;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
  .link{background:none;border:none;color:var(--ink);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:4px;
    text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--g4)}
  .list .item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .list .item:last-child{border-bottom:none}
  .item .flag{font-size:22px;width:28px;text-align:center}
  .item .meta{flex:1;min-width:0}
  .item .code{font-weight:600}
  .item .name{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
  .item .val{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
  .item .sub{font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;font-weight:400}
  .foot{font-size:11px;color:var(--muted);text-align:left;margin:18px 0 8px;line-height:1.4;font-weight:350}
  .btn{border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:4px;padding:11px 18px;
    font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:.06em;width:100%}
  .empty{color:var(--muted);font-size:14px;padding:8px 0}
  /* Auswahlliste */
  .sheet{position:fixed;inset:0;background:rgba(40,40,48,.45);display:none;z-index:10}
  .sheet.open{display:block}
  .panel{position:absolute;left:0;right:0;bottom:0;top:8%;background:var(--bg);border-radius:8px 8px 0 0;
    display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
  .panel-head{padding:16px 16px 8px;display:flex;gap:10px;align-items:center}
  .panel-head input{flex:1;font-family:inherit;font-size:16px;padding:11px 12px;border-radius:4px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);outline:none}
  .panel-list{overflow:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch}
  .star{background:none;border:none;font-size:20px;cursor:pointer;color:var(--g4);padding:4px 6px}
  .star.on{color:var(--ink)}
  .group{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 2px;font-weight:400}
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--sig-grey);color:#fff;padding:10px 16px;border-radius:4px;font-size:14px;opacity:0;transition:opacity .25s;
    pointer-events:none;z-index:20;border-left:4px solid var(--red)}
  .toast.show{opacity:1}
  .install{display:none;font-weight:400}
  .install.show{display:block}
  @media (prefers-color-scheme: dark){ .logo-box .logo-grey{display:none} .logo-box .logo-white{display:block} }
</style>
</head>
<body>
<img class="bg-car" src="assets/gr-yaris.webp" alt="" aria-hidden="true">
<div class="wrap">
  <div class="topbar">
    <div class="logo-box">
      <img class="logo logo-grey" src="assets/toyota-ellipse-grey.png" alt="Toyota">
      <img class="logo logo-white" src="assets/toyota-ellipse-white.png" alt="Toyota">
    </div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">…</span></div>
  </div>
  <header class="headline">
    <span class="bar"></span>
    <h1>Währungsrechner</h1>
    <p>Aktuelle Kurse – auch offline verfügbar</p>
  </header>

  <div class="card">
    <div class="label">Betrag</div>
    <div class="row">
      <input id="amount" class="amount" inputmode="decimal" autocomplete="off" value="100" aria-label="Betrag">
      <button class="cur-btn" id="fromBtn" data-side="from"></button>
    </div>
  </div>
  <div class="swap-wrap"><button class="swap" id="swap" aria-label="Währungen tauschen">⇅</button></div>
  <div class="card">
    <div class="label">Ergebnis</div>
    <div class="row">
      <div class="result" id="result">–</div>
      <button class="cur-btn" id="toBtn" data-side="to"></button>
    </div>
    <div class="rate" id="rateLine"></div>
  </div>

  <div class="sec-head">
    <h2>Favoriten</h2>
    <button class="link" id="editFav">Bearbeiten</button>
  </div>
  <div class="card list" id="favList"></div>

  <div class="card install" id="installHint">
    <div style="font-size:14px;line-height:1.5"><b>Tipp:</b> Für die Offline-Nutzung die App zum Home-Bildschirm hinzufügen –
      iPhone: Teilen-Symbol → „Zum Home-Bildschirm“. Android: Menü ⋮ → „App installieren“.</div>
  </div>

  <div><button class="btn" id="refresh">Kurse aktualisieren</button></div>
  <div class="foot" id="foot"></div>
</div>

<div class="sheet" id="sheet">
  <div class="panel" role="dialog" aria-modal="true">
    <div class="panel-head">
      <input id="search" placeholder="Währung suchen (z. B. USD, Zloty)" autocomplete="off">
      <button class="link" id="closeSheet">Fertig</button>
    </div>
    <div class="panel-list" id="pickList"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const LS = {
    get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };
  const $ = id => document.getElementById(id);
  const REFRESH_MS = 3 * 60 * 60 * 1000; // alle 3 Std. neu laden, wenn online

  // Eingebaute Notfall-Kurse (EUR-Basis), nur falls nie online geladen wurde
  const FALLBACK = { base:"EUR", date:null, source:"Eingebaut (Näherung)", rates:{
    EUR:1, USD:1.08, GBP:0.85, CHF:0.95, PLN:4.30, CZK:25.0, HUF:395, DKK:7.46, SEK:11.4, NOK:11.7,
    JPY:165, CNY:7.8, TRY:37, AED:3.97, CAD:1.48, AUD:1.65 } };

  const POPULAR = ["EUR","USD","GBP","CHF","PLN","CZK","DKK","SEK","NOK","HUF","JPY","CNY","TRY","AED","CAD","AUD"];

  let data = LS.get("fx_rates", null) || FALLBACK;
  let state = Object.assign({ from:"EUR", to:"USD", amount:"100",
    favs:["USD","GBP","CHF","PLN","CZK","JPY"] }, LS.get("fx_state", {}));
  let pickSide = null, favMode = false;

  const names = (() => { try { return new Intl.DisplayNames(["de"], {type:"currency"}); } catch(e){ return null; } })();
  const curName = c => { try { return (names && names.of(c)) || c; } catch(e){ return c; } };

  // Flagge aus Währungscode (erste 2 Buchstaben = Ländercode, Sonderfälle)
  const flag = c => {
    const special = { EUR:"🇪🇺", XAF:"🌍", XOF:"🌍", XCD:"🌎", XPF:"🌏", XDR:"🏦", ANG:"🇨🇼" };
    if (special[c]) return special[c];
    const cc = c.slice(0,2);
    if (!/^[A-Z]{2}$/.test(cc)) return "💱";
    return String.fromCodePoint(...[...cc].map(ch => 0x1F1E6 + ch.charCodeAt(0) - 65));
  };

  const parseAmount = s => {
    if (!s) return 0;
    s = String(s).trim().replace(/\s/g,"");
    // "1.234,56" oder "1234,56" oder "1234.56"
    if (s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
    const n = parseFloat(s);
    return isFinite(n) ? n : 0;
  };
  const fmt = (n, cur) => {
    const abs = Math.abs(n);
    const dec = abs === 0 ? 2 : abs < 0.01 ? 6 : abs < 1 ? 4 : 2;
    return new Intl.NumberFormat("de-DE",{minimumFractionDigits:Math.min(2,dec), maximumFractionDigits:dec}).format(n);
  };
  const rate = (a, b) => (data.rates[b] && data.rates[a]) ? data.rates[b] / data.rates[a] : NaN;
  const convert = (amt, a, b) => amt * rate(a, b);

  const save = () => LS.set("fx_state", state);

  function toast(msg){
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
  }

  function dateText(){
    if (!data.date) return "keine aktuellen Kurse";
    const d = new Date(data.date);
    return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"}) +
      (data.fetchedAt ? ", geladen " + new Date(data.fetchedAt).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}) : "");
  }

  function renderStatus(){
    const online = navigator.onLine;
    $("status").classList.toggle("off", !online || !data.date);
    $("statusText").textContent = online ? (data.date ? "Online" : "Lade Kurse…") : "Offline";
    $("foot").innerHTML = "Kursstand: " + dateText() + "<br>Quelle: " + (data.source || "–") +
      "<br>Kurse sind Referenzkurse – Bank- und Kartenkurse weichen ab.";
  }

  function curBtn(el, c){
    el.innerHTML = `<span class="flag">${flag(c)}</span>${c}<span class="chev">▼</span>`;
  }

  function render(){
    curBtn($("fromBtn"), state.from);
    curBtn($("toBtn"), state.to);
    const amt = parseAmount($("amount").value);
    const r = rate(state.from, state.to);
    $("result").textContent = isFinite(r) ? fmt(amt * r, state.to) : "–";
    $("rateLine").textContent = isFinite(r)
      ? `1 ${state.from} = ${fmt(r)} ${state.to}   ·   1 ${state.to} = ${fmt(1/r)} ${state.from}`
      : "Kein Kurs verfügbar";

    const list = $("favList");
    const favs = state.favs.filter(c => c !== state.from && data.rates[c]);
    if (!favs.length){ list.innerHTML = `<div class="empty">Keine Favoriten – über „Bearbeiten“ hinzufügen.</div>`; }
    else list.innerHTML = favs.map(c => {
      const v = convert(amt, state.from, c), r1 = rate(state.from, c);
      return `<div class="item" data-code="${c}">
        <div class="flag">${flag(c)}</div>
        <div class="meta"><div class="code">${c}</div><div class="name">${curName(c)}</div></div>
        <div><div class="val">${fmt(v)}</div><div class="sub">1 ${state.from} = ${fmt(r1)}</div></div>
      </div>`;
    }).join("");
    renderStatus();
  }

  // ---------- Kurse laden ----------
  async function fetchJSON(url){
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 8000);
    try { const r = await fetch(url, {signal:ctrl.signal, cache:"no-store"}); if(!r.ok) throw new Error(r.status); return await r.json(); }
    finally { clearTimeout(t); }
  }
  const SOURCES = [
    async () => { // ~160 Währungen, tägliche Aktualisierung
      const j = await fetchJSON("https://open.er-api.com/v6/latest/EUR");
      if (j.result !== "success") throw new Error("er-api");
      return { base:"EUR", rates:j.rates, date:new Date(j.time_last_update_unix*1000).toISOString(), source:"ExchangeRate-API (open.er-api.com)" };
    },
    async () => { // EZB-Referenzkurse
      const j = await fetchJSON("https://api.frankfurter.dev/v1/latest?base=EUR");
      return { base:"EUR", rates:Object.assign({EUR:1}, j.rates), date:new Date(j.date).toISOString(), source:"EZB via frankfurter.dev" };
    }
  ];

  let loading = false;
  async function loadRates(manual){
    if (loading) return; loading = true;
    if (manual) $("refresh").textContent = "Lade…";
    try {
      if (!navigator.onLine) throw new Error("offline");
      let got = null;
      for (const src of SOURCES){ try { got = await src(); break; } catch(e){} }
      if (!got) throw new Error("no source");
      got.rates.EUR = 1;
      got.fetchedAt = Date.now();
      data = got; LS.set("fx_rates", data);
      render();
      if (manual) toast("Kurse aktualisiert");
    } catch(e){
      renderStatus();
      if (manual) toast(navigator.onLine ? "Kurse konnten nicht geladen werden" : "Offline – gespeicherte Kurse werden genutzt");
    } finally {
      loading = false; $("refresh").textContent = "Kurse aktualisieren";
    }
  }
  const stale = () => !data.fetchedAt || (Date.now() - data.fetchedAt) > REFRESH_MS;

  // ---------- Auswahlliste ----------
  function openPicker(side){
    pickSide = side; favMode = side === "fav";
    $("search").value = ""; renderPick(); $("sheet").classList.add("open");
    setTimeout(() => { if (!favMode) $("search").focus(); }, 50);
  }
  function closePicker(){ $("sheet").classList.remove("open"); pickSide = null; render(); }

  function renderPick(){
    const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ł/g,"l").replace(/ß/g,"ss");
    const q = norm($("search").value.trim());
    const all = Object.keys(data.rates).sort();
    const match = c => !q || norm(c).includes(q) || norm(curName(c)).includes(q);
    const row = c => {
      const on = state.favs.includes(c);
      return `<div class="item" data-code="${c}">
        <div class="flag">${flag(c)}</div>
        <div class="meta"><div class="code">${c}</div><div class="name">${curName(c)}</div></div>
        <button class="star ${on?"on":""}" data-star="${c}" aria-label="Favorit">${on?"★":"☆"}</button>
      </div>`;
    };
    const pop = POPULAR.filter(c => data.rates[c] && match(c));
    const rest = all.filter(c => !POPULAR.includes(c) && match(c));
    let html = "";
    if (favMode) html += `<div class="group" style="text-transform:none;letter-spacing:0">Stern antippen, um Favoriten hinzuzufügen oder zu entfernen.</div>`;
    if (pop.length) html += `<div class="group">Häufig</div>` + pop.map(row).join("");
    if (rest.length) html += `<div class="group">Alle Währungen</div>` + rest.map(row).join("");
    if (!html) html = `<div class="empty">Nichts gefunden.</div>`;
    $("pickList").innerHTML = html;
  }

  $("pickList").addEventListener("click", e => {
    const star = e.target.closest("[data-star]");
    if (star){
      const c = star.dataset.star;
      state.favs = state.favs.includes(c) ? state.favs.filter(x => x !== c) : [...state.favs, c];
      save(); renderPick(); return;
    }
    const it = e.target.closest(".item"); if (!it) return;
    const c = it.dataset.code;
    if (favMode){
      state.favs = state.favs.includes(c) ? state.favs.filter(x => x !== c) : [...state.favs, c];
      save(); renderPick(); return;
    }
    if (pickSide === "from"){ if (c === state.to) state.to = state.from; state.from = c; }
    else { if (c === state.from) state.from = state.to; state.to = c; }
    save(); closePicker();
  });
  $("search").addEventListener("input", renderPick);
  $("closeSheet").addEventListener("click", closePicker);
  $("sheet").addEventListener("click", e => { if (e.target.id === "sheet") closePicker(); });

  // ---------- Bedienung ----------
  $("fromBtn").addEventListener("click", () => openPicker("from"));
  $("toBtn").addEventListener("click", () => openPicker("to"));
  $("editFav").addEventListener("click", () => openPicker("fav"));
  $("swap").addEventListener("click", () => {
    [state.from, state.to] = [state.to, state.from]; save(); render();
  });
  $("amount").value = state.amount;
  $("amount").addEventListener("input", e => {
    e.target.value = e.target.value.replace(/[^\d.,\s]/g, "");
    state.amount = e.target.value; save(); render();
  });
  $("amount").addEventListener("focus", e => e.target.select());
  $("favList").addEventListener("click", e => {
    const it = e.target.closest(".item"); if (!it) return;
    state.to = it.dataset.code; save(); render(); window.scrollTo({top:0, behavior:"smooth"});
  });
  $("result").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText($("result").textContent); toast("Ergebnis kopiert"); } catch(e){}
  });
  $("refresh").addEventListener("click", () => loadRates(true));
  window.addEventListener("online", () => { renderStatus(); loadRates(false); });
  window.addEventListener("offline", renderStatus);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && navigator.onLine && stale()) loadRates(false); });

  // Installationshinweis nur im Browser (nicht als installierte App)
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (!standalone) $("installHint").classList.add("show");

  // Service Worker für Offline-Betrieb
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  render();
  loadRates(false);
})();
</script>
</body>
</html>
